name: Deploy

# Builds the site and publishes it to the gh-pages branch of the public repo
# zerone0x/beltworks-play, which serves https://zerone0x.github.io/beltworks-play/.
# Authentication uses the DEPLOY_KEY secret: an SSH deploy key with write access
# to that repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /beltworks-play/

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Publish to zerone0x/beltworks-play (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: zerone0x/beltworks-play
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Deploy ${{ github.repository }}@${{ github.sha }}
